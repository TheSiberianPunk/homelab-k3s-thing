apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  annotations:
    argocd.argoproj.io/syncwave: "2" # workload starts after infrastructure 
spec:
  project: default
  sources:
   - repoURL: https://jellyfin.github.io/jellyfin-helm
     chart: jellyfin
     targetRevision: "3.2.0"
     helm:
      valueFiles:
         - $values/workload/jellyfin/values.yaml
   - repoURL: https://github.com/TheSiberianPunk/homelab-k3s-thing.git
     targetRevision: HEAD
     ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
     - CreateNamespace=true