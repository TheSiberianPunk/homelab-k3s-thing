apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbittorrent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
   - repoURL: https://harish2k01.github.io/helm-charts
     chart: qbittorrent
     targetRevision: "0.1.2"
     helm:
      valueFiles:
         - $values/workload/qbittorrent/values.yaml
   - repoURL: https://github.com/TheSiberianPunk/homelab-k3s-thing.git
     targetRevision: HEAD
     ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: qbittorrent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
     - CreateNamespace=true