# Argo CD

# The operator CRDs are larger than the 262144 byte limit
# on the kubectl.kubernetes.io/last-applied-configuration
# annotation — crd-prometheuses.yaml alone is around 840 KiB 
# — so a client-side apply fails with metadata.annotations: Too long.
# Sync the application with ServerSideApply=true.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
     - repoURL: https://prometheus-community.github.io/helm-charts
       chart: kube-prometheus-stack
       targetRevision: "91.8.1" 
       helm:
         valueFiles:
          - $values/infrastructure/prometheus/values.yaml
     - repoURL: https://github.com/TheSiberianPunk/homelab-k3s-thing.git
       targetRevision: HEAD
       ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
     - CreateNamespace=true
     - ServerSideApply=true