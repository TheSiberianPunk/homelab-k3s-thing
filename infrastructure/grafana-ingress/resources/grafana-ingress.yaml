apiVersion:  traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
  - websecure
  routes:
   - match: Host(`grafana.home`)
     kind: Rule
     services:
      - name: monitoring-grafana # recheck with kubectl get svc -n monitoring
        port: 80
  tls: {} # self signed
