apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://myrepo
    targetRevision: HEAD
    path: infrastructure
    directory:
      recurse: true
    destination:
      server: https://kubernetes.default.svc # internal kuber API
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true