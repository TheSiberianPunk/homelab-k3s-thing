apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://myrepo
    targetRevision: HEAD
    path: bootstrap
  destination:
    server: https://kubernetes.default.svc # internal kuber API
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true